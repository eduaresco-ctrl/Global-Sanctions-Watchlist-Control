name: daily-sanctions-seizure-watch

on:
  schedule:
    - cron: "0 8 * * *"            # once a day at 08:00 UTC (10:00 in Central European Summer Time)
  workflow_dispatch:               # lets you press "Run workflow" by hand
    inputs:
      days:
        description: "Look-back days (use 30 for the very first run to back-fill history)"
        default: "2"

permissions:
  contents: write                  # so the job can save the updated database and dashboard

concurrency:
  group: sanctions-seizure-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - name: Collect, analyse and build the dashboard
        run: python -u run_daily.py --days "${{ github.event.inputs.days || '2' }}" 2>&1 | tee run.log
      - name: Keep the run log (so a failure can be read)
        if: always()
        run: |
          mkdir -p data
          tail -n 200 run.log > data/last_run.log || true
          git config user.name  "sanctions-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_run.log
          git diff --cached --quiet || git commit -m "Run log $(date -u +%FT%TZ)"
          git push || (git pull --rebase --autostash -X theirs origin main && git push) || true
      - name: Save results
        run: |
          git config user.name  "sanctions-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sanctions_watch.db docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push || (git pull --rebase --autostash -X theirs origin main && git push)
