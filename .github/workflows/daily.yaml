name: daily-sanctions-seizure-watch

on:
  schedule:
    # GitHub schedules in UTC only. Brussels is UTC+2 in summer and UTC+1 in winter, so the job is started at both
    # 08:05 and 09:05 UTC and the first step lets only the one that falls at 10:xx Brussels time go on.
    - cron: "5 8 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:               # lets you press "Run workflow" by hand
    inputs:
      days:
        description: "Look-back days (2 = normal day, 30 = one month, 90 = three-month back-fill)"
        default: "2"

permissions:
  contents: write                  # so the job can save the updated database and dashboard

concurrency:
  group: sanctions-seizure-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Only continue at 10:xx Brussels time (scheduled runs)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Brussels date +%H)" != "10" ]; then
            echo "Not 10:00 in Brussels - skipping this trigger"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.go == 'yes'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.go == 'yes'
        run: python -m spacy download en_core_web_sm
      - name: Collect, analyse and build the dashboard
        if: steps.gate.outputs.go == 'yes'
        run: python -u run_daily.py --days "${{ github.event.inputs.days || '2' }}" 2>&1 | tee run.log
      - name: Keep the run log (so a failure can be read)
        if: always() && steps.gate.outputs.go == 'yes'
        run: |
          mkdir -p data
          tail -n 200 run.log > data/last_run.log || true
          git config user.name  "sanctions-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_run.log
          git diff --cached --quiet || git commit -m "Run log $(date -u +%FT%TZ)"
          git push || (git pull --rebase --autostash -X theirs origin main && git push) || true
      - name: Save results
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name  "sanctions-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sanctions_watch.db docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push || (git pull --rebase --autostash -X theirs origin main && git push)
